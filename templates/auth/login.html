{% extends "base.html" %}
{% block content %}
<div class="auth-card">
  <h1>Sign in</h1>
  <p class="muted">Welcome back to Wize.</p>

  {% if errors.form %}<div class="flash flash-error">{{ errors.form }}</div>{% endif %}
  {% if errors.email %}
    <p class="small">
      <a href="{{ url_for('auth.verify_email_page', email=errors.email) }}">Verify email or request a new code</a>
    </p>
  {% endif %}

  <form method="post" action="{{ url_for('auth.login_page') }}" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input type="hidden" name="next" value="{{ next_url or '/' }}">
    <label for="email">E-mail address</label>
    <input id="email" name="email" type="email" autocomplete="email" required
           value="{{ form.email or '' }}">

    <label for="password">Password</label>
    <input id="password" name="password" type="password"
           autocomplete="current-password" required>

    <button type="submit" class="btn btn-primary btn-block">Sign in</button>
  </form>

  <p class="muted small">
    No account yet? <a href="{{ url_for('auth.register_page') }}">Create one</a>.
  </p>
</div>
{% endblock %}
